<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #060405;          /* the dark */
    --velvet: #5c0a10;       /* curtain red, deep */
    --red: #b3141f;          /* curtain red, lit */
    --lamp: #e7c891;         /* warm lamplight */
    --paper: #ece4d6;        /* text */
    --dim: #8b8079;          /* quiet text */
    --faint: #3a2f2e;        /* hairlines */
    --blue: #3b5bff;         /* the one cold accent: evidence */
    --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ink); color: var(--paper); font: 15px/1.6 var(--sans); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* Stage dressing: vignette, faint curtain folds at the edges, film grain */
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 42%, rgba(92,10,16,.22) 0%, rgba(6,4,5,0) 55%),
                radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.85) 100%); }
  .curtain { position: fixed; top: 0; bottom: 0; width: 7vw; max-width: 90px; pointer-events: none; z-index: 0; opacity: .8;
    background: repeating-linear-gradient(90deg, #2a0306 0 9px, #4a070d 9px 16px, #2a0306 16px 26px); }
  .curtain.l { left: 0; mask-image: linear-gradient(90deg, #000 0%, transparent 100%); -webkit-mask-image: linear-gradient(90deg, #000, transparent); }
  .curtain.r { right: 0; mask-image: linear-gradient(270deg, #000 0%, transparent 100%); -webkit-mask-image: linear-gradient(270deg, #000, transparent); }
  .grain { position: fixed; inset: -50%; pointer-events: none; z-index: 5; opacity: .07; animation: grain 1.2s steps(6) infinite;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  @keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-3%)} 60%{transform:translate(-2%,-1%)} 80%{transform:translate(3%,3%)} 100%{transform:translate(0,0)} }
  @media (prefers-reduced-motion: reduce) { .grain { animation: none; } .title { animation: none !important; } }

  .app { position: relative; z-index: 1; height: 100vh; display: grid; grid-template-rows: 56px 1fr 40px; }
  /* Letterbox bars */
  .bar { background: #000; display: flex; align-items: center; gap: 22px; padding: 0 28px; border-bottom: 1px solid #120c0c; }
  .bar.bottom { border-top: 1px solid #120c0c; border-bottom: 0; font-size: 12px; color: var(--dim); justify-content: space-between; }
  .title { font: 500 20px/1 var(--serif); letter-spacing: .42em; color: var(--paper); text-transform: uppercase; white-space: nowrap;
           animation: flicker 9s infinite; }
  @keyframes flicker { 0%, 92%, 100% { opacity: 1; } 93% { opacity: .55; } 94% { opacity: 1; } 96% { opacity: .7; } }
  .caps { font: 600 10.5px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }
  .clock { font: italic 500 18px/1 var(--serif); color: var(--lamp); letter-spacing: .04em; white-space: nowrap; }
  .sallow { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .sallow .track { display: flex; gap: 4px; }
  .sallow .track span { width: 16px; height: 2px; background: #4a2326; }
  .sallow .track span.on { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .sallow .where { font: italic 15px/1 var(--serif); color: #d9a5a5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  .spacer { flex: 1; }
  .link { background: none; border: 0; padding: 0; color: var(--dim); font: 500 11px/1 var(--sans); letter-spacing: .2em;
          text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  .link:hover { color: var(--paper); }

  main { display: grid; grid-template-columns: 280px 1fr; min-height: 0; max-width: 1240px; width: 100%; margin: 0 auto; }
  /* The dossier */
  aside { padding: 28px 26px; overflow-y: auto; border-right: 1px solid var(--faint); }
  aside section + section { margin-top: 34px; }
  aside h2 { margin: 0 0 14px; }
  .evidence { position: relative; padding: 2px 0 2px 14px; margin-bottom: 16px; border-left: 1px solid var(--blue); }
  .evidence b { display: block; font: 600 10.5px/1.4 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: #9fb0ff; }
  .evidence p { margin: 4px 0 0; font: 16px/1.45 var(--serif); color: var(--paper); }
  .empty { font: italic 16px/1.5 var(--serif); color: var(--dim); }
  .person { padding: 12px 0; border-top: 1px solid var(--faint); }
  .person:first-of-type { border-top: 0; padding-top: 0; }
  .person .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .person .name { font: 500 21px/1.1 var(--serif); color: var(--paper); }
  .person .place { font-size: 11px; color: var(--dim); }
  .person .hint { margin: 4px 0 0; font: italic 15px/1.4 var(--serif); color: #b9aea4; }
  .person .want { margin: 4px 0 0; font: 15px/1.4 var(--serif); color: var(--lamp); }
  .person .trust { position: relative; height: 1px; background: var(--faint); margin: 10px 0 7px; }
  .person .trust i { position: absolute; left: 0; top: -1px; height: 3px; background: var(--paper); opacity: .8; }
  .person .trust u { position: absolute; top: -4px; width: 1px; height: 9px; background: var(--lamp); }
  .person .status { font: 600 10.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .person.ready .status { color: var(--lamp); } .person.shared .status { color: #9fb0ff; } .person.closed .status { color: var(--red); }
  .person.ready .name { text-shadow: 0 0 18px rgba(231,200,145,.45); }

  /* The scene */
  .scene { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .scene-head { padding: 26px 48px 10px; text-align: center; }
  .scene-head .place { font: italic 400 15px/1 var(--serif); color: var(--dim); letter-spacing: .06em; }
  .scene-head .who { margin-top: 6px; font: 500 40px/1 var(--serif); letter-spacing: .14em; text-transform: uppercase; color: var(--paper); }
  .scene-head .who:empty { display: none; }
  .feed { overflow-y: auto; padding: 12px 48px 24px; display: flex; flex-direction: column; gap: 18px; }
  .line { max-width: 640px; animation: rise .5s ease-out; }
  @keyframes rise { from { transform: translateY(5px); filter: blur(1px); } }
  .line.npc { align-self: flex-start; }
  .line.npc .who { font: 600 10.5px/1 var(--sans); letter-spacing: .26em; color: var(--red); text-transform: uppercase; }
  .line.npc p { margin: 6px 0 0; font: 21px/1.45 var(--serif); color: var(--paper); }
  .line.you { align-self: flex-end; text-align: right; }
  .line.you p { margin: 0; font: italic 19px/1.45 var(--serif); color: var(--lamp); }
  .line.you p::before { content: "— "; color: var(--dim); }
  .line.narration { align-self: center; text-align: center; max-width: 560px; font: italic 17px/1.55 var(--serif); color: var(--dim); }
  .line.event { align-self: center; text-align: center; max-width: 600px; padding: 14px 0; border-top: 1px solid var(--velvet); border-bottom: 1px solid var(--velvet); }
  .line.event .caps { color: var(--red); display: block; margin-bottom: 8px; }
  .line.event p { margin: 0; font: 19px/1.5 var(--serif); color: #e6d2c7; }
  .line.clue { align-self: stretch; max-width: none; padding: 14px 18px; border-left: 2px solid var(--blue);
               background: linear-gradient(90deg, rgba(59,91,255,.10), rgba(59,91,255,0) 70%); }
  .line.clue .caps { color: #9fb0ff; display: block; margin-bottom: 6px; }
  .line.clue p { margin: 0; font: 19px/1.5 var(--serif); }
  .line.system { align-self: center; font: 600 10.5px/1.4 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: #a8957a; text-align: center; }
  .line.hunt { align-self: center; font: 600 10.5px/1.4 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: #d0525a; text-align: center; }
  .line.ending { align-self: center; text-align: center; padding: 26px 0 8px; }
  .line.ending .t { font: 500 46px/1.05 var(--serif); letter-spacing: .12em; text-transform: uppercase; color: var(--paper); text-shadow: 0 0 30px rgba(179,20,31,.6); }
  .line.ending p { margin: 12px auto 0; max-width: 520px; font: italic 19px/1.5 var(--serif); color: #cdbfb3; }
  .howto { align-self: center; max-width: 560px; text-align: center; padding: 8px 0 4px; }
  .howto .caps { color: var(--lamp); }
  .howto ol { list-style: none; padding: 0; margin: 14px 0 0; counter-reset: s; }
  .howto li { counter-increment: s; font: 17px/1.5 var(--serif); color: #cdbfb3; margin: 10px 0; }
  .howto li::before { content: counter(s, upper-roman) ".  "; color: var(--red); font-weight: 600; }
  .typing { align-self: flex-start; font: italic 16px var(--serif); color: var(--dim); display: none; }
  .typing.on { display: block; animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }

  /* Controls: text, not boxes */
  .controls { padding: 16px 48px 22px; border-top: 1px solid var(--faint); max-height: 44vh; overflow-y: auto;
              background: linear-gradient(180deg, rgba(6,4,5,.6), rgba(6,4,5,.95)); }
  .prompt { margin: 0 0 8px; }
  .options { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .opt { background: none; border: 0; padding: 5px 0; cursor: pointer; text-align: left; color: #d8cfc4;
         font: 18px/1.35 var(--serif); transition: color .15s, padding .15s; }
  .opt::before { content: "—  "; color: var(--faint); transition: color .15s; }
  .opt:hover:not(:disabled) { color: #fff; padding-left: 6px; }
  .opt:hover:not(:disabled)::before { color: var(--red); }
  .opt:disabled { opacity: .35; cursor: default; }
  .opt.deal { color: var(--lamp); } .opt.deal::before { content: "◆  "; color: #7a6542; }
  .opt.risky { font-style: italic; } .opt.risky::after { content: "  · a gamble"; font: 600 10px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--red); }
  .group + .group { margin-top: 14px; }
  .say { display: flex; gap: 16px; align-items: center; margin-top: 14px; }
  .say input { flex: 1; background: none; border: 0; border-bottom: 1px solid var(--faint); padding: 8px 2px; color: var(--paper);
               font: italic 19px var(--serif); outline: none; }
  .say input:focus { border-bottom-color: var(--red); }
  .say input::placeholder { color: #5e534f; }
  .places { display: flex; flex-wrap: wrap; gap: 8px 30px; }
  .place-btn { background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--paper); font: 500 22px/1.2 var(--serif); letter-spacing: .04em;
               border-bottom: 1px solid transparent; }
  .place-btn:hover:not(:disabled) { border-bottom-color: var(--red); }
  .hideouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: 4px 0 18px; }
  .hideout { background: rgba(59,91,255,.05); border: 1px solid rgba(59,91,255,.35); padding: 14px 16px; cursor: pointer; text-align: left; color: var(--paper); }
  .hideout:hover:not(:disabled) { border-color: var(--blue); box-shadow: 0 0 24px -8px var(--blue); }
  .hideout b { display: block; font: 500 21px/1.2 var(--serif); }
  .hideout span { display: block; margin-top: 6px; font: italic 15px/1.4 var(--serif); color: var(--dim); }
  .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 22px; margin: 6px 0 14px; }
  .card .name { font: 500 22px/1 var(--serif); }
  .card .meta { margin: 6px 0 8px; }
  .card ul { margin: 0; padding: 0; list-style: none; }
  .card li { font: italic 16px/1.45 var(--serif); color: #cdbfb3; margin: 3px 0; }
  .err { color: #e06a72; font-size: 13px; min-height: 0; }

  @media (max-width: 860px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100vh; grid-template-rows: auto auto 40px; }
    .bar { flex-wrap: wrap; padding: 12px 18px; gap: 10px 16px; }
    main { grid-template-columns: minmax(0, 1fr); }
    .scene, .feed, .controls { min-width: 0; }
    body, .app { overflow-x: hidden; }
    .title { font-size: 17px; letter-spacing: .3em; }
    .sallow .where { max-width: 160px; }
    .line.ending .t { font-size: 32px; }
    .line.npc p { font-size: 19px; }
    aside { order: 2; border-right: 0; border-top: 1px solid var(--faint); padding: 22px 18px; }
    .scene { height: 86vh; }
    .scene-head, .feed, .controls { padding-left: 18px; padding-right: 18px; }
    .scene-head .who { font-size: 30px; }
    .hideouts { grid-template-columns: 1fr; }
    .curtain { display: none; }
  }
</style>
</head>
<body>
<div class="vignette"></div><div class="curtain l"></div><div class="curtain r"></div><div class="grain"></div>
<div class="app">
  <header class="bar">
    <span class="title">After Hours</span>
    <span class="clock" id="clock">Midnight</span>
    <div class="sallow" title="Sallow, Veyra's hunter, is looking for Rook too.">
      <span class="caps">Sallow</span><div class="track" id="track"></div><span class="where" id="sallow-where"></span>
    </div>
    <div class="spacer"></div>
    <span class="caps" id="credits"></span>
    <button class="link" id="restart">New night</button>
  </header>
  <main>
    <aside>
      <section><h2 class="caps" id="board-title">The case</h2><div id="board"></div></section>
      <section><h2 class="caps">People</h2><div id="leads"></div></section>
    </aside>
    <section class="scene">
      <div class="scene-head"><div class="place" id="place">The Kessler block</div><div class="who" id="who"></div></div>
      <div class="feed" id="feed"></div>
      <div class="controls">
        <div class="typing" id="typing"></div>
        <div id="panel"></div>
        <div class="err" id="err"></div>
      </div>
    </section>
  </main>
  <footer class="bar bottom"><span id="hint"></span><span class="caps" id="mode"></span></footer>
</div>
<script>
const SLOTS = ["midnight", "1am", "2am", "3am"];
const SLOT_NAMES = { midnight: "Midnight", "1am": "One a.m.", "2am": "Two a.m.", "3am": "Three a.m." };
const NAMES = { mara: "Mara", jun: "Jun", nico: "Nico" };
const FACT_TEXT = { lied_to: "Knows you lied", promised: "Remembers your promise", kindness: "Remembers you were kind",
  flirted: "Remembers you flirting", asked_openly: "Heard you asking around" };
const STATUS = { new: () => "Not met", met: () => "Ask what it would take", want: (l) => `Make a deal, or trust ${l.needed}`,
  ready: () => "Ready to talk", shared: () => "Told you", closed: () => "Won't talk" };
const INTRO = `Rook didn't come home. Their last message: "At the Lantern. Tell no one." The checkpoint opens at four.`;
const $ = (id) => document.getElementById(id);
let snap = null, busy = false;

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style") n.style.cssText = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) n.append(kid);
  return n;
}

async function api(action, body = {}) {
  if (busy) return;
  busy = true; $("err").textContent = "";
  const waitingOn = snap && snap.npc && (action === "say" || action === "option") ? NAMES[snap.npc] : null;
  $("typing").textContent = waitingOn ? `${waitingOn} is thinking…` : "";
  $("typing").classList.toggle("on", !!waitingOn);
  document.querySelectorAll(".controls button, .controls input").forEach((b) => (b.disabled = true));
  try {
    const res = await fetch(action === "state" ? "/api/state" : `/api/${action}`,
      action === "state" ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    snap = data; render();
  } catch (e) { $("err").textContent = e.message; render(); }
  finally { busy = false; $("typing").classList.remove("on"); }
}

function line(m) {
  switch (m.kind) {
    case "npc": return el("div", { class: "line npc" }, el("span", { class: "who" }, NAMES[m.speaker] || ""), el("p", {}, m.text));
    case "player": return el("div", { class: "line you" }, el("p", {}, m.text));
    case "event": {
      const [title, ...rest] = m.text.split(": ");
      return el("div", { class: "line event" }, el("span", { class: "caps" }, title), el("p", {}, rest.join(": ")));
    }
    case "clue": return el("div", { class: "line clue" }, el("span", { class: "caps" }, "Evidence"), el("p", {}, m.text.replace(/^Drone footage: /, "")));
    case "ending": {
      const [title, ...rest] = m.text.split(". ");
      return el("div", { class: "line ending" }, el("div", { class: "t" }, title), el("p", {}, rest.join(". ")));
    }
    case "narration": return /^(MIDNIGHT|1AM|2AM|3AM) · /.test(m.text) ? null : el("div", { class: "line narration" }, m.text);
    default: return el("div", { class: `line ${m.kind}` }, m.text);
  }
}

function addFeed(items) {
  for (const m of items) { const n = line(m); if (n) $("feed").append(n); }
}

function render() {
  if (!snap) return;
  addFeed(snap.feed || []); snap.feed = [];
  $("clock").textContent = snap.phase === "dawn" ? "Dawn" : SLOT_NAMES[snap.slot];
  $("credits").textContent = `${snap.credits} credits`;
  $("track").replaceChildren(...Array.from({ length: snap.sallow.max }, (_, j) => el("span", { class: j < snap.sallow.heat ? "on" : "" })));
  $("sallow-where").textContent = snap.sallow.where.replace(/^Sallow is /, "");
  $("mode").textContent = snap.mode === "agent" ? "Agent mode" : "Scripted mode";

  $("place").textContent = snap.npc ? snap.location_name : snap.phase === "finale" ? snap.location_name
    : snap.phase === "dawn" ? "Four a.m." : "The Kessler block";
  $("who").textContent = snap.npc ? snap.npc_name : snap.phase === "finale" ? "Rook" : "";

  $("board-title").textContent = `The case · ${snap.case_board.length} ${snap.case_board.length === 1 ? "piece" : "pieces"}`;
  $("board").replaceChildren(...(snap.case_board.length ? snap.case_board.map((c) =>
    el("div", { class: "evidence" }, el("b", {}, c.title), el("p", {}, c.text)))
    : [el("div", { class: "empty" }, "Nothing yet. Each of them knows one piece.")]));

  $("leads").replaceChildren(...snap.leads.map((l) => el("div", { class: `person ${l.status}` },
    el("div", { class: "row1" }, el("span", { class: "name" }, l.name), el("span", { class: "place" }, l.where)),
    l.want ? el("p", { class: "want" }, l.want) : el("p", { class: "hint" }, l.hint),
    el("div", { class: "trust", title: `Trust ${l.trust}. Needs ${l.needed} to talk them round without a deal.` },
      el("i", { style: `width:${Math.max(0, l.trust) * 20}%` }), el("u", { style: `left:${Math.min(l.needed, 5) * 20}%` })),
    el("span", { class: "status" }, STATUS[l.status](l)))));

  const panel = $("panel"); panel.replaceChildren();
  let hint = "";
  if (snap.phase === "choose_location") {
    if (snap.hideouts.length) {
      panel.append(el("p", { class: "caps prompt" }, "Where is Rook? One guess."),
        el("div", { class: "hideouts" }, ...snap.hideouts.map((h) => el("button", { class: "hideout",
          onclick: () => { if (confirm(`Search the ${h.name}? You only get one guess.`)) api("visit", { location: h.id }); } },
          el("b", {}, h.name), el("span", {}, h.about)))),
        el("p", { class: "caps prompt" }, "Or spend the last hour with someone"));
      hint = "Read the case. What does the evidence point to?";
    } else {
      panel.append(el("p", { class: "caps prompt" }, "Where do you spend the hour?"));
      hint = "Each place, one person. Each person, one piece of the night.";
    }
    panel.append(el("div", { class: "places" }, ...snap.locations.map((l) =>
      el("button", { class: "place-btn", onclick: () => api("visit", { location: l.id }) }, l.name))));
  } else if (snap.phase === "event" && snap.event) {
    panel.append(el("div", { class: "options" }, ...Object.entries(snap.event.choices).map(([k, label]) =>
      el("button", { class: "opt", onclick: () => api("event", { choice: k }) }, label))));
    hint = "Something's happening. Choose.";
  } else if (snap.phase === "talk") {
    panel.append(el("div", { class: "group" }, el("div", { class: "options" }, ...snap.options.map((o, j) =>
      el("button", { class: "opt", onclick: () => snap.mode === "agent" ? api("say", { text: o }) : api("option", { index: j }) }, o)))));
    if (snap.deals.length) {
      panel.append(el("div", { class: "group" }, el("p", { class: "caps prompt" }, `Offer ${snap.npc_name}`),
        el("div", { class: "options" }, ...snap.deals.map((d) =>
          el("button", { class: `opt deal ${d.risky ? "risky" : ""}`, onclick: () => api("deal", { deal: d.id }) },
            d.label.replace(/ \(risky\)$/, ""))))));
    }
    const leave = el("button", { class: "link", onclick: () => api("leave") }, "Leave");
    if (snap.mode === "agent") {
      const input = el("input", { type: "text", maxlength: "300", placeholder: `Say anything to ${snap.npc_name}…` });
      const send = () => { const t = input.value.trim(); if (t) api("say", { text: t }); };
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
      panel.append(el("div", { class: "say" }, input, el("button", { class: "link", onclick: send }, "Say"), leave));
      setTimeout(() => input.focus(), 0);
    } else {
      panel.append(el("div", { class: "footer-row" }, el("span"), leave));
    }
    hint = `${snap.exchanges_left} ${snap.exchanges_left === 1 ? "exchange" : "exchanges"} left this hour`;
  } else if (snap.phase === "finale") {
    panel.append(el("div", { class: "options" }, ...Object.entries(snap.finale_choices).map(([k, label]) =>
      el("button", { class: "opt", onclick: () => api("finale", { choice: k }) }, label))));
    hint = "The chip. Decide.";
  } else if (snap.phase === "dawn") {
    panel.append(el("div", { class: "cards" }, ...snap.dawn_cards.map((c) => {
      const items = [];
      if (c.promise_broken) items.push("“You made me a promise.”");
      if (c.betrayed) items.push("Knows you sold her out");
      if (c.deal && !c.promise_broken) items.push("You kept your deal");
      c.facts.forEach((f) => items.push(FACT_TEXT[f] || f));
      c.remembers.forEach((r) => items.push(r));
      if (!items.length) items.push("Barely remembers you.");
      return el("div", { class: "card" }, el("div", { class: "name" }, c.npc),
        el("div", { class: "caps meta" }, `Trust ${c.trust} · Warmth ${c.warmth}`), el("ul", {}, ...items.map((t) => el("li", {}, t))));
    })), el("button", { class: "link", onclick: newNight }, "Play another night"));
    hint = snap.ending ? snap.ending.title : "";
  }
  $("hint").textContent = hint;
  requestAnimationFrame(() => { $("feed").scrollTop = $("feed").scrollHeight; });
}

function howTo() {
  const typing = snap && snap.mode === "agent";
  return el("div", { class: "howto" }, el("span", { class: "caps" }, "How the night works"), el("ol", {},
    el("li", {}, "Find Rook before four. Each hour, go somewhere and talk to whoever is there."),
    el("li", {}, "Everyone wants something. Ask what it would take. Some deals are gambles; some betray someone else."),
    el("li", {}, "Sallow is hunting Rook too. Shouting, or getting caught in a lie, brings him closer."),
    el("li", {}, "At three, you decide where Rook is hiding. One guess."),
    el("li", {}, typing ? "Say anything. They remember." : "Choose what to say. They remember.")));
}

function newNight() {
  $("feed").replaceChildren(el("div", { class: "line narration" }, INTRO), howTo());
  api("new", { mode: snap ? snap.mode : undefined });
}
$("restart").addEventListener("click", () => { if (confirm("Start a new night? This one will be lost.")) newNight(); });
$("feed").append(el("div", { class: "line narration" }, INTRO));
api("state").then(() => { if (snap && snap.slot === "midnight" && snap.phase === "choose_location" && !snap.case_board.length) {
  $("feed").append(howTo()); } });
</script>
</body>
</html>
