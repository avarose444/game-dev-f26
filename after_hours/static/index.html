<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Josefin+Sans:wght@300;400;600&family=Poiret+One&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0c0920;        /* Hollywood-hills midnight */
    --panel: rgba(17, 12, 40, .78);
    --gold: #d6b46a;         /* champagne / brass */
    --gold-dim: #6f5a33;
    --pink: #ff3d9a;         /* neon */
    --cyan: #2de2ff;         /* neon */
    --violet: #b18cff;       /* neon */
    --text: #eee6ff;
    --soft: #a99fc8;
    --hair: rgba(214, 180, 106, .28);
    --script: "Yellowtail", "Brush Script MT", cursive;
    --deco: "Poiret One", "Josefin Sans", sans-serif;
    --caps: "Josefin Sans", "Futura", "Avenir Next", sans-serif;
    --serif: "Cormorant Garamond", Georgia, serif;
    --mara: var(--pink); --jun: var(--cyan); --nico: var(--violet);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--night); color: var(--text); font: 16px/1.55 var(--serif); overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* ---------- Backdrop: night sky, city glow, hills, palms ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 35% at 50% 100%, rgba(255, 61, 154, .28), transparent 70%),
      radial-gradient(ellipse 45% 30% at 85% 100%, rgba(45, 226, 255, .18), transparent 70%),
      linear-gradient(180deg, #07051a 0%, #120b30 55%, #2a1146 100%); }
  .stars { position: fixed; inset: 0 0 40% 0; z-index: 0; pointer-events: none; opacity: .55;
    background-image: radial-gradient(1px 1px at 12% 22%, #fff, transparent), radial-gradient(1px 1px at 33% 12%, #cfc3ff, transparent),
      radial-gradient(1px 1px at 58% 30%, #fff, transparent), radial-gradient(1px 1px at 76% 9%, #ffd8ef, transparent),
      radial-gradient(1px 1px at 88% 26%, #fff, transparent), radial-gradient(1px 1px at 22% 40%, #bfe9ff, transparent),
      radial-gradient(1px 1px at 46% 6%, #fff, transparent), radial-gradient(1px 1px at 67% 44%, #fff, transparent); }
  .hills { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 34vh; z-index: 0; pointer-events: none; opacity: .9; }
  .grain { position: fixed; inset: -50%; pointer-events: none; z-index: 6; opacity: .06; animation: grain 1.4s steps(6) infinite;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-3%,2%)} 50%{transform:translate(2%,-3%)} 75%{transform:translate(3%,3%)} 100%{transform:translate(0,0)} }

  /* ---------- Frame ---------- */
  .app { position: relative; z-index: 1; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; max-width: 1320px; margin: 0 auto; padding: 0 24px; }
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 0 10px; }
  .sign { text-align: center; line-height: 1; }
  .neon { font: 400 48px/1 var(--script); color: #ffe3f1; letter-spacing: .01em;
    text-shadow: 0 0 4px #fff, 0 0 10px var(--pink), 0 0 22px var(--pink), 0 0 42px var(--pink), 0 0 80px rgba(255,61,154,.6);
    animation: buzz 7s infinite; }
  @keyframes buzz { 0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; } 19%, 21% { opacity: .35; } 63% { opacity: .6; } }
  .sign .sub { margin-top: 6px; font: 400 11px/1 var(--caps); letter-spacing: .55em; color: var(--gold); text-transform: uppercase; }
  .hdr-left, .hdr-right { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .hdr-right { justify-content: flex-end; }
  .clock { font: 400 22px/1 var(--deco); color: var(--text); letter-spacing: .08em; }
  .clock { white-space: nowrap; }
  .clock small { white-space: nowrap; display: block; margin-top: 5px; font: 400 10px/1 var(--caps); letter-spacing: .32em; color: var(--soft); text-transform: uppercase; }
  .sallow { display: flex; flex-direction: column; gap: 5px; }
  .bulbs { display: flex; gap: 6px; }
  .bulbs span { width: 8px; height: 8px; border-radius: 50%; background: #2a1830; box-shadow: inset 0 0 0 1px #4a2a48; }
  .bulbs span.on { background: #ff4a5c; box-shadow: 0 0 6px #ff4a5c, 0 0 12px rgba(255,74,92,.6); }
  .sallow small { font: 400 10px/1.2 var(--caps); letter-spacing: .24em; text-transform: uppercase; color: #ff8a96; max-width: 340px;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { font: 400 10.5px/1 var(--caps); letter-spacing: .28em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
  .link { background: none; border: 0; padding: 4px 0; cursor: pointer; font: 600 10.5px/1 var(--caps); letter-spacing: .28em;
          text-transform: uppercase; color: var(--soft); white-space: nowrap; border-bottom: 1px solid transparent; }
  .link:hover { color: var(--text); border-bottom-color: var(--pink); }

  /* Art deco panel: thin gold double rule with corner brackets */
  .deco { position: relative; background: var(--panel); border: 1px solid var(--hair); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .deco::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(214,180,106,.14); pointer-events: none; }
  .deco::after { content: ""; position: absolute; inset: -1px; pointer-events: none;
    background:
      linear-gradient(var(--gold), var(--gold)) top left / 18px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top left / 1px 18px no-repeat,
      linear-gradient(var(--gold), var(--gold)) top right / 18px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) top right / 1px 18px no-repeat,
      linear-gradient(var(--gold), var(--gold)) bottom left / 18px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom left / 1px 18px no-repeat,
      linear-gradient(var(--gold), var(--gold)) bottom right / 18px 1px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom right / 1px 18px no-repeat; }
  .label { font: 400 10.5px/1 var(--caps); letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
  .label.rule { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
  .label.rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--hair), transparent); }

  main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; min-height: 0; padding-bottom: 14px; }

  /* ---------- Left: room keys + guest register ---------- */
  aside { padding: 22px 20px; overflow-y: auto; }
  aside section + section { margin-top: 26px; }
  .keys { display: flex; flex-direction: column; gap: 12px; }
  .key { position: relative; padding: 12px 14px 12px 40px; border-radius: 4px 14px 14px 4px;
         background: linear-gradient(135deg, #2a2140, #1c1532); border: 1px solid rgba(45,226,255,.35);
         box-shadow: 0 0 18px -8px var(--cyan); }
  .key:nth-child(odd) { transform: rotate(-.6deg); } .key:nth-child(even) { transform: rotate(.5deg); }
  .key::before { content: ""; position: absolute; left: 14px; top: 16px; width: 12px; height: 12px; border-radius: 50%;
                 border: 1px solid var(--gold); background: var(--night); }
  .key .no { font: 400 10px/1 var(--caps); letter-spacing: .3em; color: var(--cyan); text-transform: uppercase; }
  .key .t { margin-top: 3px; font: 400 15px/1.2 var(--deco); color: var(--text); letter-spacing: .04em; }
  .key p { margin: 6px 0 0; font: 15px/1.45 var(--serif); color: #d8d0f0; }
  .empty { font: italic 16px/1.5 var(--serif); color: var(--soft); }
  .guest { padding: 12px 0 14px; border-bottom: 1px solid rgba(214,180,106,.14); }
  .guest:last-child { border-bottom: 0; }
  .guest .row1 { display: flex; justify-content: space-between; align-items: baseline; }
  .guest .name { font: 400 30px/1 var(--script); color: var(--c); text-shadow: 0 0 10px var(--c); }
  .guest .room { font: 400 10px/1 var(--caps); letter-spacing: .24em; text-transform: uppercase; color: var(--soft); }
  .guest .note { margin: 6px 0 0; font: italic 15.5px/1.4 var(--serif); color: #c8bfe2; }
  .guest .want { margin: 6px 0 0; font: 15.5px/1.4 var(--serif); color: var(--gold); }
  .guest .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; }
  .diamonds { display: flex; gap: 5px; }
  .diamonds i { width: 8px; height: 8px; transform: rotate(45deg); border: 1px solid #4a3f66; }
  .diamonds i.on { background: var(--c); border-color: var(--c); box-shadow: 0 0 6px var(--c); }
  .diamonds i.need { border-color: var(--gold); }
  .status { font: 600 10px/1 var(--caps); letter-spacing: .22em; text-transform: uppercase; color: var(--soft); }
  .guest.ready .status { color: var(--gold); } .guest.shared .status { color: var(--cyan); } .guest.closed .status { color: #ff6b7a; }
  .guest.ready .name { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { text-shadow: 0 0 4px #fff, 0 0 18px var(--c), 0 0 36px var(--c); } }

  /* ---------- Right: the scene ---------- */
  .scene { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
  .scene-head { padding: 20px 40px 8px; text-align: center; }
  .scene-head .where { font: 400 12px/1 var(--caps); letter-spacing: .42em; text-transform: uppercase; color: var(--gold); }
  .scene-head .who { margin-top: 8px; font: 400 54px/1 var(--script); color: #fff; text-shadow: 0 0 6px #fff, 0 0 18px var(--c), 0 0 40px var(--c); }
  .scene-head .who:empty { display: none; }
  .divider { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px auto 0; color: var(--gold); font-size: 9px; }
  .divider::before, .divider::after { content: ""; width: 70px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .divider::after { transform: scaleX(-1); }
  .feed { overflow-y: auto; padding: 14px 44px 24px; display: flex; flex-direction: column; gap: 18px; }
  .ln { max-width: 640px; animation: rise .45s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } }
  .ln.npc { align-self: flex-start; padding-left: 14px; border-left: 1px solid var(--c); }
  .ln.npc .who { font: 400 22px/1 var(--script); color: var(--c); text-shadow: 0 0 8px var(--c); }
  .ln.npc p { margin: 4px 0 0; font: 21px/1.45 var(--serif); color: var(--text); }
  .ln.you { align-self: flex-end; text-align: right; }
  .ln.you p { margin: 0; font: italic 19px/1.45 var(--serif); color: var(--gold); }
  .ln.narration { align-self: center; text-align: center; max-width: 560px; font: italic 17px/1.55 var(--serif); color: var(--soft); }
  .ln.event { align-self: center; text-align: center; max-width: 600px; padding: 16px 22px; }
  .ln.event .label { color: var(--pink); }
  .ln.event p { margin: 10px 0 0; font: 19px/1.5 var(--serif); }
  .ln.clue { align-self: center; max-width: 560px; text-align: center; padding: 16px 22px; border: 1px solid rgba(45,226,255,.45);
             background: linear-gradient(180deg, rgba(45,226,255,.10), rgba(45,226,255,.02)); box-shadow: 0 0 30px -12px var(--cyan); }
  .ln.clue .label { color: var(--cyan); }
  .ln.clue p { margin: 8px 0 0; font: 19px/1.5 var(--serif); }
  .ln.system, .ln.hunt { align-self: center; text-align: center; font: 400 10.5px/1.5 var(--caps); letter-spacing: .26em; text-transform: uppercase; }
  .ln.system { color: #cdb88a; } .ln.hunt { color: #ff7d8a; }
  .ln.ending { align-self: center; text-align: center; padding: 26px 0 6px; }
  .ln.ending .t { font: 400 72px/1 var(--script); color: #fff;
    text-shadow: 0 0 6px #fff, 0 0 18px var(--pink), 0 0 40px var(--pink), 0 0 90px rgba(255,61,154,.6); animation: buzz 9s infinite; }
  .ln.ending p { margin: 16px auto 0; max-width: 520px; font: italic 20px/1.5 var(--serif); color: #d7cdf0; }
  .howto { align-self: center; max-width: 560px; text-align: center; padding: 20px 26px; }
  .howto ol { list-style: none; padding: 0; margin: 12px 0 0; counter-reset: s; }
  .howto li { counter-increment: s; font: 17px/1.5 var(--serif); color: #d7cdf0; margin: 9px 0; }
  .howto li::before { content: counter(s, upper-roman) "  "; font-family: var(--deco); color: var(--pink); }
  .typing { font: italic 16px var(--serif); color: var(--soft); display: none; margin-bottom: 8px; }
  .typing.on { display: block; animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }

  /* ---------- Controls ---------- */
  .controls { padding: 16px 40px 18px; border-top: 1px solid var(--hair); max-height: 46vh; overflow-y: auto; }
  .opts { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .opt { background: none; border: 0; padding: 5px 0; cursor: pointer; text-align: left; color: #e4dcf8; font: 18.5px/1.35 var(--serif);
         transition: color .15s, transform .15s; }
  .opt::before { content: "✦  "; font-size: 11px; vertical-align: 2px; color: var(--gold-dim); transition: color .15s; }
  .opt:hover:not(:disabled) { color: #fff; transform: translateX(4px); }
  .opt:hover:not(:disabled)::before { color: var(--pink); text-shadow: 0 0 8px var(--pink); }
  .opt:disabled { opacity: .35; cursor: default; }
  .opt.deal { color: var(--gold); } .opt.deal::before { content: "◆  "; color: var(--gold); }
  .opt.risky::after { content: "a gamble"; margin-left: 10px; padding: 2px 6px; font: 600 9px/1 var(--caps); letter-spacing: .2em;
                      text-transform: uppercase; color: var(--pink); border: 1px solid rgba(255,61,154,.5); vertical-align: 3px; }
  .group + .group { margin-top: 14px; }
  .group .label { margin-bottom: 6px; display: block; }
  .say { display: flex; gap: 18px; align-items: center; margin-top: 14px; }
  .say input { flex: 1; background: rgba(255,255,255,.03); border: 0; border-bottom: 1px solid var(--hair); padding: 9px 4px;
               color: var(--text); font: italic 19px var(--serif); outline: none; }
  .say input:focus { border-bottom-color: var(--pink); box-shadow: 0 6px 16px -12px var(--pink); }
  .say input::placeholder { color: #6f6590; }
  .places { display: flex; flex-wrap: wrap; gap: 12px 14px; margin-top: 8px; }
  .place { background: none; cursor: pointer; padding: 12px 20px; border: 1px solid var(--hair); color: var(--text);
           font: 400 17px/1 var(--deco); letter-spacing: .1em; transition: border-color .15s, box-shadow .15s, color .15s; }
  .place small { display: block; margin-top: 6px; font: 400 9.5px/1 var(--caps); letter-spacing: .26em; text-transform: uppercase; color: var(--soft); }
  .place:hover:not(:disabled) { border-color: var(--c, var(--pink)); box-shadow: 0 0 18px -6px var(--c, var(--pink)); color: #fff; }
  .marquees { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 10px 0 18px; }
  .marquee { position: relative; cursor: pointer; text-align: center; color: var(--text); padding: 18px 14px; background: #120d27;
             border: 3px dotted #ffd98a; border-radius: 6px; box-shadow: 0 0 14px -4px rgba(255,217,138,.6), inset 0 0 20px -10px rgba(255,217,138,.6); }
  .marquee:hover:not(:disabled) { border-color: #fff2c8; box-shadow: 0 0 26px -2px rgba(255,217,138,.9), inset 0 0 26px -8px rgba(255,217,138,.9); }
  .marquee b { display: block; font: 400 19px/1.15 var(--deco); letter-spacing: .06em; }
  .marquee span { display: block; margin-top: 8px; font: italic 15px/1.4 var(--serif); color: var(--soft); }
  .rowx { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin: 4px 0 14px; }
  .card { padding: 14px 16px; }
  .card .name { font: 400 30px/1 var(--script); color: var(--c); text-shadow: 0 0 10px var(--c); }
  .card .meta { margin: 8px 0; display: block; }
  .card ul { margin: 0; padding: 0; list-style: none; }
  .card li { font: italic 16px/1.45 var(--serif); color: #d7cdf0; margin: 3px 0; }
  .err { color: #ff7d8a; font-size: 14px; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 12px; }
  footer .hint { font: italic 15px var(--serif); color: var(--soft); }

  /* ---------- Phone ---------- */
  .icon-btn { white-space: nowrap; background: none; border: 1px solid var(--hair); color: var(--text); cursor: pointer; padding: 7px 12px; position: relative;
              font: 400 10.5px/1 var(--caps); letter-spacing: .24em; text-transform: uppercase; }
  .icon-btn:hover { border-color: var(--pink); box-shadow: 0 0 14px -6px var(--pink); }
  .icon-btn .dot { position: absolute; top: -4px; right: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--pink);
                   box-shadow: 0 0 8px var(--pink); display: none; }
  .icon-btn.unread .dot { display: block; animation: pulse-dot 1.2s ease-in-out infinite; }
  @keyframes pulse-dot { 50% { transform: scale(1.4); } }
  .overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
             background: rgba(5, 3, 15, .72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .overlay.open { display: flex; animation: fadein .35s ease-out; }
  @keyframes fadein { from { opacity: 0; } }
  .phone { width: 320px; height: 620px; max-height: 92vh; border-radius: 44px; padding: 14px; background: #050409;
           box-shadow: 0 0 0 2px #2a2440, 0 0 0 9px #0f0c1c, 0 30px 80px -10px rgba(255,61,154,.35), 0 0 120px -30px var(--cyan);
           display: flex; flex-direction: column; animation: rise-phone .5s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise-phone { from { transform: translateY(40px) scale(.96); opacity: 0; } }
  .screen { flex: 1; border-radius: 32px; overflow: hidden; position: relative; display: flex; flex-direction: column;
            background: radial-gradient(ellipse 120% 70% at 50% 110%, #ff3d9a44, transparent 60%),
                        radial-gradient(ellipse 90% 60% at 10% -10%, #2de2ff33, transparent 60%), #0d0a22; }
  .notch { width: 96px; height: 24px; border-radius: 14px; background: #000; margin: 8px auto 0; flex: none; }
  .lock { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 34px 16px 20px; }
  .lock .big { font: 300 76px/1 var(--caps); letter-spacing: -.02em; color: #fff; }
  .lock .day { margin-top: 8px; font: 400 11px/1 var(--caps); letter-spacing: .3em; text-transform: uppercase; color: var(--soft); }
  .notif { margin-top: auto; width: 100%; text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 18px; border: 0;
           background: rgba(255,255,255,.12); color: #fff; backdrop-filter: blur(10px); animation: notif-in .6s .5s both cubic-bezier(.2,.9,.3,1.2); }
  .notif:hover { background: rgba(255,255,255,.18); }
  @keyframes notif-in { from { transform: translateY(-30px); opacity: 0; } }
  .notif .from { display: flex; justify-content: space-between; font: 600 11px/1 var(--caps); letter-spacing: .1em; text-transform: uppercase; color: #ffd0e6; }
  .notif .msg { margin-top: 6px; font: 15px/1.35 var(--caps); }
  .tap { margin-top: 14px; font: 400 10px/1 var(--caps); letter-spacing: .3em; text-transform: uppercase; color: var(--soft); animation: breathe 1.6s infinite; }
  .thread { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .thread-head { padding: 10px 16px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.08); }
  .thread-head b { display: block; font: 400 26px/1 var(--script); color: var(--pink); text-shadow: 0 0 8px var(--pink); }
  .thread-head small { font: 400 10px/1 var(--caps); letter-spacing: .24em; color: var(--soft); text-transform: uppercase; }
  .msgs { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .stamp { align-self: center; font: 400 10px/1 var(--caps); letter-spacing: .16em; color: var(--soft); margin: 6px 0 2px; }
  .bub { max-width: 82%; padding: 8px 12px; border-radius: 18px; font: 14.5px/1.35 var(--caps); }
  .bub.them { align-self: flex-start; background: #2a2245; color: #f2ecff; border-bottom-left-radius: 6px; }
  .bub.them .who { display: block; font: 600 9.5px/1 var(--caps); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 4px; color: var(--c, #ffd0e6); }
  .bub.me { align-self: flex-end; background: linear-gradient(135deg, #ff3d9a, #c13bff); color: #fff; border-bottom-right-radius: 6px; }
  .bub.fail { opacity: .6; } .failed { align-self: flex-end; font: 600 9.5px/1 var(--caps); color: #ff7d8a; letter-spacing: .12em; text-transform: uppercase; }
  .bub.new { animation: rise .4s ease-out; box-shadow: 0 0 18px -4px var(--c, var(--pink)); }
  .phone-go { margin: 10px 14px 14px; padding: 13px; border-radius: 22px; border: 0; cursor: pointer; color: #fff;
              background: linear-gradient(135deg, #ff3d9a, #8f3bff); font: 600 11px/1 var(--caps); letter-spacing: .3em; text-transform: uppercase;
              box-shadow: 0 0 24px -6px var(--pink); }
  .toast { position: fixed; top: 16px; left: 50%; transform: translate(-50%, -140%); z-index: 15; width: min(340px, 90vw); cursor: pointer;
           padding: 12px 14px; border-radius: 18px; background: rgba(30, 24, 54, .92); border: 1px solid rgba(255,255,255,.1);
           backdrop-filter: blur(12px); box-shadow: 0 12px 40px -10px #000, 0 0 30px -12px var(--pink); transition: transform .5s cubic-bezier(.2,.9,.3,1.2); }
  .toast.show { transform: translate(-50%, 0); }
  .toast .from { font: 600 10.5px/1 var(--caps); letter-spacing: .12em; text-transform: uppercase; color: #ffd0e6; }
  .toast .msg { margin-top: 5px; font: 14.5px/1.35 var(--caps); color: #fff; }

  /* ---------- Title card between scenes ---------- */
  .card-over { position: fixed; inset: 0; z-index: 18; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
               background: radial-gradient(ellipse at center, #120b2c 0%, #05030f 75%); cursor: pointer; }
  .card-over.open { display: flex; animation: card 2.2s ease-in-out both; }
  @keyframes card { 0% { opacity: 0; } 18%, 78% { opacity: 1; } 100% { opacity: 0; } }
  .card-over .time { font: 400 13px/1 var(--caps); letter-spacing: .5em; text-transform: uppercase; color: var(--gold); }
  .card-over .loc { font: 400 40px/1.1 var(--deco); letter-spacing: .12em; color: var(--text); text-align: center; }
  .card-over .who { font: 400 64px/1 var(--script); color: #fff; text-shadow: 0 0 6px #fff, 0 0 20px var(--c), 0 0 50px var(--c); }
  .card-over .rule { width: 160px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

  /* ---------- Sallow closing in ---------- */
  .threat { position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: 0;
            box-shadow: inset 0 0 160px 30px rgba(255, 40, 60, .55); }
  .threat.pulse { animation: threat 1.6s ease-out; }
  @keyframes threat { 0% { opacity: 0; } 15% { opacity: 1; } 35% { opacity: .3; } 50% { opacity: .8; } 100% { opacity: 0; } }
  .bulbs.flash span.on:last-of-type { animation: pulse-dot .4s ease-in-out 4; }

  /* ---------- New room key ---------- */
  .key.new { animation: key-drop .9s cubic-bezier(.2,.9,.3,1.3); box-shadow: 0 0 34px -4px var(--cyan); }
  @keyframes key-drop { 0% { transform: translateY(-40px) rotate(-8deg); opacity: 0; } 60% { transform: translateY(4px) rotate(2deg); opacity: 1; } }

  /* ---------- Typewriter, keys, parallax ---------- */
  .ln.npc p.typing-now::after { content: "▍"; color: var(--c); animation: breathe .8s infinite; margin-left: 2px; }
  .k { display: inline-block; min-width: 18px; margin-right: 8px; padding: 2px 4px; border: 1px solid #3c3360; border-radius: 3px;
       font: 600 9.5px/1 var(--caps); color: var(--soft); text-align: center; vertical-align: 3px; }
  .opt .k { margin-left: -2px; }
  .opt::before { content: none !important; }
  .opt.deal .k { border-color: var(--gold-dim); color: var(--gold); }
  .hills, .stars { transition: transform .6s ease-out; }
  .hills { transform: translateX(calc(var(--mx, 0) * -14px)); }
  .stars { transform: translate(calc(var(--mx, 0) * -6px), calc(var(--my, 0) * -4px)); }

  @media (prefers-reduced-motion: reduce) { .threat.pulse, .card-over.open, .key.new, .phone, .notif { animation: none !important; } }
  @media (prefers-reduced-motion: reduce) { .grain, .neon, .ln.ending .t, .guest.ready .name { animation: none; } }
  @media (max-width: 900px) {
    body { overflow: auto; }
    body, .app { overflow-x: hidden; }
    .app { height: auto; min-height: 100vh; padding: 0 14px; }
    header { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .hdr-left, .hdr-right { justify-content: center; flex-wrap: wrap; }
    .hdr-left { order: 2; } .hdr-right { order: 3; }
    .neon { font-size: 40px; }
    .sign .sub { letter-spacing: .28em; }
    main { grid-template-columns: minmax(0, 1fr); }
    aside { order: 2; }
    .scene { height: 84vh; }
    .scene-head, .feed, .controls { padding-left: 16px; padding-right: 16px; }
    .scene-head .who { font-size: 42px; }
    .marquees { grid-template-columns: 1fr; }
    .ln.ending .t { font-size: 50px; }
  }
</style>

<script>
const SLOT_TIME = { midnight: ["12:00", "Midnight"], "1am": ["1:00", "One a.m."], "2am": ["2:00", "Two a.m."], "3am": ["3:00", "Three a.m."] };
const NAMES = { mara: "Mara", jun: "Jun", nico: "Nico" };
const COLOR = { mara: "var(--mara)", jun: "var(--jun)", nico: "var(--nico)" };
const PLACE_NPC = { lantern: "mara", rooftop: "jun", clinic: "nico" };
const FACT_TEXT = { lied_to: "Knows you lied", promised: "Remembers your promise", kindness: "Remembers you were kind",
  flirted: "Remembers you flirting", asked_openly: "Heard you asking around" };
const STATUS = { new: () => "Not yet met", met: () => "Ask what it would take", want: (l) => `A deal, or trust ${l.needed}`,
  ready: () => "Ready to talk", shared: () => "Told you", closed: () => "Won't talk" };
const KEY_NO = { C1: "No. 1", C2: "No. 2", C3: "No. 3", E5: "No. 4" };
const INTRO = `Rook didn't come home. Their last message: "At the Lantern. Tell no one." The checkpoint opens at four.`;
const $ = (id) => document.getElementById(id);
let snap = null, busy = false;

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style") n.style.cssText = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) n.append(kid);
  return n;
}

async function api(action, body = {}) {
  if (busy) return;
  busy = true; $("err").textContent = "";
  const waitingOn = snap && snap.npc && (action === "say" || action === "option") ? NAMES[snap.npc] : null;
  $("typing").textContent = waitingOn ? `${waitingOn} is thinking…` : "";
  $("typing").classList.toggle("on", !!waitingOn);
  document.querySelectorAll(".controls button, .controls input").forEach((b) => (b.disabled = true));
  try {
    const res = await fetch(action === "state" ? "/api/state" : `/api/${action}`,
      action === "state" ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    const prev = snap; snap = data; render(); effects(prev, data, action);
  } catch (e) { $("err").textContent = e.message; render(); }
  finally { busy = false; $("typing").classList.remove("on"); }
}

function line(m) {
  switch (m.kind) {
    case "npc": return el("div", { class: "ln npc", style: `--c:${COLOR[m.speaker]}` },
      el("span", { class: "who" }, NAMES[m.speaker] || ""), el("p", {}, m.text));
    case "player": return el("div", { class: "ln you" }, el("p", {}, m.text));
    case "event": {
      const [title, ...rest] = m.text.split(": ");
      return el("div", { class: "ln event deco" }, el("span", { class: "label" }, title), el("p", {}, rest.join(": ")));
    }
    case "clue": return el("div", { class: "ln clue" }, el("span", { class: "label" }, "New evidence"), el("p", {}, m.text.replace(/^Drone footage: /, "")));
    case "ending": {
      const [title, ...rest] = m.text.split(". ");
      return el("div", { class: "ln ending" }, el("div", { class: "t" }, title), el("p", {}, rest.join(". ")));
    }
    case "narration": return /^(MIDNIGHT|1AM|2AM|3AM) · /.test(m.text) ? null : el("div", { class: "ln narration" }, m.text);
    default: return el("div", { class: `ln ${m.kind}` }, m.text);
  }
}

function render() {
  if (!snap) return;
  for (const m of snap.feed || []) {
    const n = line(m); if (!n) continue;
    $("feed").append(n);
    if (!replaying && m.kind === "npc") typeInto(n.querySelector("p"), m.text);
  }
  snap.feed = [];
  const [time, word] = snap.phase === "dawn" ? ["4:00", "Dawn"] : SLOT_TIME[snap.slot];
  $("clock").replaceChildren(time, el("small", {}, word));
  $("credits").textContent = `${snap.credits} credits`;
  $("bulbs").replaceChildren(...Array.from({ length: snap.sallow.max }, (_, j) => el("span", { class: j < snap.sallow.heat ? "on" : "" })));
  $("sallow-where").textContent = "Sallow · " + snap.sallow.where.replace(/^Sallow is /, "").replace(/\.$/, "");
  $("mode").textContent = snap.mode === "agent" ? "Agent mode" : "Scripted mode";

  document.querySelector(".scene").style.setProperty("--c", snap.npc ? COLOR[snap.npc] : "var(--pink)");
  $("place").textContent = snap.npc || snap.phase === "finale" ? snap.location_name : snap.phase === "dawn" ? "Four a.m." : "The Kessler Block";
  $("who").textContent = snap.npc ? snap.npc_name : snap.phase === "finale" ? "Rook" : "";

  $("board-title").textContent = `Room keys · ${snap.case_board.length}`;
  $("board").replaceChildren(...(snap.case_board.length ? snap.case_board.map((c) =>
    el("div", { class: `key ${c.id === newKey ? "new" : ""}` }, el("div", { class: "no" }, KEY_NO[c.id] || "No. ?"), el("div", { class: "t" }, c.title), el("p", {}, c.text)))
    : [el("div", { class: "empty" }, "No keys yet. Each guest holds one piece of the night.")]));

  $("leads").replaceChildren(...snap.leads.map((l) => el("div", { class: `guest ${l.status}`, style: `--c:${COLOR[l.npc]}` },
    el("div", { class: "row1" }, el("span", { class: "name" }, l.name), el("span", { class: "room" }, l.where)),
    l.want ? el("p", { class: "want" }, l.want) : el("p", { class: "note" }, l.hint),
    el("div", { class: "row2" },
      el("div", { class: "diamonds", title: `Trust ${l.trust}. Needs ${l.needed} to talk them round without a deal.` },
        ...Array.from({ length: 5 }, (_, j) => el("i", { class: j < l.trust ? "on" : j === Math.min(l.needed, 5) - 1 ? "need" : "" }))),
      el("span", { class: "status" }, STATUS[l.status](l))))));

  const panel = $("panel"); panel.replaceChildren();
  let hint = "";
  if (snap.phase === "choose_location") {
    if (snap.hideouts.length) {
      panel.append(el("span", { class: "label" }, "Where is Rook? One guess."),
        el("div", { class: "marquees" }, ...snap.hideouts.map((h) => el("button", { class: "marquee",
          onclick: () => { if (confirm(`Search the ${h.name}? You only get one guess.`)) api("visit", { location: h.id }); } },
          el("b", {}, h.name), el("span", {}, h.about)))),
        el("span", { class: "label" }, "Or spend the last hour with someone"));
      hint = "Read your room keys. What does the evidence point to?";
    } else {
      panel.append(el("span", { class: "label" }, "Where do you spend the hour?"));
      hint = "Each place, one guest. Each guest, one piece of the night.";
    }
    panel.append(el("div", { class: "places" }, ...snap.locations.map((l) => el("button", {
      class: "place", style: `--c:${COLOR[PLACE_NPC[l.id]]}`, onclick: () => api("visit", { location: l.id }) },
      l.name, el("small", {}, NAMES[PLACE_NPC[l.id]])))));
  } else if (snap.phase === "event" && snap.event) {
    panel.append(el("div", { class: "opts" }, ...Object.entries(snap.event.choices).map(([k, label]) =>
      el("button", { class: "opt", onclick: () => api("event", { choice: k }) }, label))));
    hint = "Something's happening. Choose.";
  } else if (snap.phase === "talk") {
    panel.append(el("div", { class: "group" }, el("div", { class: "opts" }, ...snap.options.map((o, j) =>
      el("button", { class: "opt", onclick: () => snap.mode === "agent" ? api("say", { text: o }) : api("option", { index: j }) }, o)))));
    if (snap.deals.length) {
      panel.append(el("div", { class: "group" }, el("span", { class: "label" }, `Offer ${snap.npc_name}`),
        el("div", { class: "opts" }, ...snap.deals.map((d) =>
          el("button", { class: `opt deal ${d.risky ? "risky" : ""}`, onclick: () => api("deal", { deal: d.id }) },
            d.label.replace(/ \(risky\)$/, ""))))));
    }
    const leave = el("button", { class: "link", onclick: () => api("leave") }, "Leave");
    if (snap.mode === "agent") {
      const input = el("input", { type: "text", maxlength: "300", placeholder: `Say anything to ${snap.npc_name}…` });
      const send = () => { const t = input.value.trim(); if (t) api("say", { text: t }); };
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
      panel.append(el("div", { class: "say" }, input, el("button", { class: "link", onclick: send }, "Say"), leave));
      setTimeout(() => input.focus(), 0);
    } else {
      panel.append(el("div", { class: "rowx" }, el("span"), leave));
    }
    hint = `${snap.exchanges_left} ${snap.exchanges_left === 1 ? "exchange" : "exchanges"} left this hour`;
  } else if (snap.phase === "finale") {
    panel.append(el("div", { class: "opts" }, ...Object.entries(snap.finale_choices).map(([k, label]) =>
      el("button", { class: "opt", onclick: () => api("finale", { choice: k }) }, label))));
    hint = "The chip. Decide.";
  } else if (snap.phase === "dawn") {
    panel.append(el("div", { class: "cards" }, ...snap.dawn_cards.map((c) => {
      const items = [];
      if (c.promise_broken) items.push("“You made me a promise.”");
      if (c.betrayed) items.push("Knows you sold her out");
      if (c.deal && !c.promise_broken) items.push("You kept your deal");
      c.facts.forEach((f) => items.push(FACT_TEXT[f] || f));
      c.remembers.forEach((r) => items.push(r));
      if (!items.length) items.push("Barely remembers you.");
      return el("div", { class: "card deco", style: `--c:${COLOR[c.npc.toLowerCase()]}` }, el("div", { class: "name" }, c.npc),
        el("span", { class: "label meta" }, `Trust ${c.trust} · Warmth ${c.warmth}`), el("ul", {}, ...items.map((t) => el("li", {}, t))));
    })), el("button", { class: "link", onclick: newNight }, "Check in for another night"));
    hint = snap.ending ? snap.ending.title : "";
  }
  $("hint").textContent = hint;
  [...panel.querySelectorAll(".opt, .place, .marquee")].slice(0, 9).forEach((b, i) => b.prepend(el("span", { class: "k" }, String(i + 1))));
  if (typeof Sound !== "undefined") Sound.setPlace(snap.phase === "dawn" ? "dawn" : snap.phase === "finale" ? "lift" : snap.npc ? snap.location : "street");
  requestAnimationFrame(() => { $("feed").scrollTop = $("feed").scrollHeight; });
}

// ---------- Effects: what changed since the last screen ----------
let replaying = true, newKey = null;
function effects(prev, now, action) {
  if (!prev || action === "state" || action === "new") return;
  if (now.sallow.heat > prev.sallow.heat) {
    const t = $("threat"); t.classList.remove("pulse"); void t.offsetWidth; t.classList.add("pulse");
    $("bulbs").classList.add("flash"); setTimeout(() => $("bulbs").classList.remove("flash"), 1700);
    Sound.play("hunt");
  }
  if (now.case_board.length > prev.case_board.length) {
    newKey = now.case_board[now.case_board.length - 1].id; render(); newKey = null; Sound.play("clue");
  }
  if (action === "deal") Sound.play("deal");
  const enteredScene = (now.npc && now.npc !== prev.npc) || (now.phase === "finale" && prev.phase !== "finale");
  if (enteredScene) titleCard(now);
  if (now.phase === "dawn" && prev.phase !== "dawn") setTimeout(() => Sound.play("ending"), 400);
  checkTexts(now, false);
}

// ---------- Typewriter ----------
let typingJobs = [];
function typeInto(p, text) {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;
  p.textContent = ""; p.classList.add("typing-now");
  let i = 0;
  const job = { done: false, finish() { if (!job.done) { job.done = true; clearInterval(id); p.textContent = text; p.classList.remove("typing-now"); } } };
  const id = setInterval(() => {
    i += 2; p.textContent = text.slice(0, i);
    $("feed").scrollTop = $("feed").scrollHeight;
    if (i >= text.length) job.finish();
  }, 22);
  typingJobs.push(job);
}
$("feed").addEventListener("click", () => { typingJobs.forEach((j) => j.finish()); typingJobs = []; });

// ---------- Title card between scenes ----------
function titleCard(now) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const card = $("card");
  const [time, word] = SLOT_TIME[now.slot] || ["", ""];
  const who = now.npc ? now.npc_name : "Rook";
  card.style.setProperty("--c", now.npc ? COLOR[now.npc] : "var(--pink)");
  card.replaceChildren(el("div", { class: "time" }, `${time} · ${word}`), el("div", { class: "rule" }),
    el("div", { class: "loc" }, now.location_name), el("div", { class: "who" }, who));
  card.classList.remove("open"); void card.offsetWidth; card.classList.add("open");
  Sound.play("step");
  clearTimeout(titleCard.t); titleCard.t = setTimeout(() => card.classList.remove("open"), 2200);
}
$("card").addEventListener("click", () => $("card").classList.remove("open"));

// ---------- Rook's phone ----------
const THREAD = [
  { stamp: "Yesterday 9:04 PM" },
  { from: "Rook", text: "got a job tonight. easy money. don't wait up" },
  { stamp: "11:12 PM" },
  { from: "Rook", text: "theres a guy in a grey jacket watching the door" },
  { from: "Rook", text: "probably nothing" },
  { stamp: "11:31 PM" },
  { from: "Rook", text: "At the Lantern. Tell no one." },
  { stamp: "11:58 PM" },
  { me: true, text: "where are you??", failed: true },
];
const LATER = [   // texts that arrive during the night
  { id: "mara", from: "Mara", c: "var(--mara)", when: (s) => lead(s, "mara") === "shared" && s.slot !== "midnight",
    text: "whatever you find out there, be careful kid" },
  { id: "jun", from: "Jun", c: "var(--jun)", when: (s) => lead(s, "jun") === "shared", text: "Remember our arrangement." },
  { id: "tail", from: "Unknown number", c: "#ff7d8a", when: (s) => s.sallow.heat >= 3, text: "Stop looking for your friend." },
  { id: "rook", from: "Rook", c: "var(--pink)", when: (s) => s.slot === "3am" && s.phase !== "dawn",
    text: (s) => s.rook_text },
  { id: "close", from: "Unknown number", c: "#ff7d8a", when: (s) => s.sallow.heat >= 5, text: "I'm closer than you are." },
];
let received = [], unread = false;
const lead = (s, npc) => (s.leads.find((l) => l.npc === npc) || {}).status;

function checkTexts(now, silent) {
  for (const t of LATER) {
    if (received.some((r) => r.id === t.id) || !t.when(now)) continue;
    const text = typeof t.text === "function" ? t.text(now) : t.text;
    received.push({ ...t, text, fresh: !silent });
    if (!silent) { unread = true; toast(t.from, text); }
  }
  $("phone-btn").classList.toggle("unread", unread);
}

function toast(from, text) {
  $("toast-from").textContent = from; $("toast-msg").textContent = text;
  const t = $("toast"); t.classList.add("show"); Sound.play("buzz");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 4200);
}
$("toast").addEventListener("click", () => { $("toast").classList.remove("show"); openThread(); });

function showLock() {
  const [time] = SLOT_TIME.midnight;
  $("screen").replaceChildren(el("div", { class: "notch" }), el("div", { class: "lock" },
    el("div", { class: "big" }, time), el("div", { class: "day" }, "Kessler Block · Rain"),
    el("button", { class: "notif", onclick: openThread },
      el("div", { class: "from" }, el("span", {}, "Rook"), el("span", {}, "11:31 PM")),
      el("div", { class: "msg" }, "At the Lantern. Tell no one.")),
    el("div", { class: "tap" }, "Tap the message")));
  $("phone").classList.add("open");
}

function openThread() {
  Sound.start(); updateSoundBtn();
  const msgs = el("div", { class: "msgs" });
  for (const m of THREAD) {
    if (m.stamp) msgs.append(el("div", { class: "stamp" }, m.stamp));
    else if (m.me) { msgs.append(el("div", { class: `bub me ${m.failed ? "fail" : ""}` }, m.text)); if (m.failed) msgs.append(el("div", { class: "failed" }, "Not delivered")); }
    else msgs.append(el("div", { class: "bub them" }, m.text));
  }
  if (received.length) msgs.append(el("div", { class: "stamp" }, "Tonight"));
  for (const r of received) {
    msgs.append(el("div", { class: `bub them ${r.fresh ? "new" : ""}`, style: `--c:${r.c}` }, el("span", { class: "who" }, r.from), r.text));
    r.fresh = false;
  }
  const started = snap && (snap.phase !== "choose_location" || snap.slot !== "midnight" || snap.case_board.length);
  $("screen").replaceChildren(el("div", { class: "notch" }), el("div", { class: "thread" },
    el("div", { class: "thread-head" }, el("b", {}, "Rook"), el("small", {}, "Last seen 11:31 PM")), msgs),
    el("button", { class: "phone-go", onclick: closePhone }, started ? "Back to the night" : "Go find Rook"));
  $("phone").classList.add("open");
  unread = false; $("phone-btn").classList.remove("unread");
  requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });
}
function closePhone() { $("phone").classList.remove("open"); Sound.start(); updateSoundBtn(); }
$("phone-btn").addEventListener("click", openThread);
$("phone").addEventListener("click", (e) => { if (e.target.id === "phone" && $("screen").querySelector(".thread")) closePhone(); });

// ---------- Sound button ----------
function updateSoundBtn() { $("sound-btn").textContent = !Sound.started ? "Sound" : Sound.muted ? "Sound off" : "Sound on"; }
$("sound-btn").addEventListener("click", () => { if (!Sound.started) Sound.start(); else Sound.setMuted(!Sound.muted); updateSoundBtn(); });

// ---------- Keyboard: 1-9 picks, Esc closes the phone ----------
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closePhone(); $("card").classList.remove("open"); return; }
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if ($("phone").classList.contains("open")) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) { const b = $("panel").querySelectorAll(".opt, .place, .marquee")[n - 1]; if (b && !b.disabled) b.click(); }
});

// ---------- Parallax ----------
if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  document.addEventListener("mousemove", (e) => {
    document.body.style.setProperty("--mx", (e.clientX / innerWidth - 0.5).toFixed(3));
    document.body.style.setProperty("--my", (e.clientY / innerHeight - 0.5).toFixed(3));
  });
}

function howTo() {
  const typing = snap && snap.mode === "agent";
  return el("div", { class: "howto deco" }, el("span", { class: "label" }, "House rules"), el("ol", {},
    el("li", {}, "Find Rook before four. Each hour, go somewhere and talk to whoever is there."),
    el("li", {}, "Every guest wants something. Ask what it would take. Some deals are gambles; some betray someone else."),
    el("li", {}, "Sallow is hunting Rook too. Shouting, or getting caught in a lie, brings him closer."),
    el("li", {}, "At three, you decide where Rook is hiding. One guess."),
    el("li", {}, typing ? "Say anything. They remember." : "Choose what to say. They remember.")));
}

function newNight() {
  received = []; unread = false; $("phone-btn").classList.remove("unread");
  $("feed").replaceChildren(el("div", { class: "ln narration" }, INTRO), howTo());
  api("new", { mode: snap ? snap.mode : undefined }).then(showLock);
}
$("restart").addEventListener("click", () => { if (confirm("Start a new night? This one will be lost.")) newNight(); });
$("feed").append(el("div", { class: "ln narration" }, INTRO));
updateSoundBtn();
api("state").then(() => {
  replaying = false;
  if (!snap) return;
  const fresh = snap.slot === "midnight" && snap.phase === "choose_location" && !snap.case_board.length;
  if (fresh) { $("feed").append(howTo()); showLock(); }
  else checkTexts(snap, true);   // rebuild tonight's texts quietly after a reload
});
</script>
</body>
</html>
