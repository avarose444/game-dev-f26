<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After Hours</title>
<style>
  :root {
    --bg: #07070d; --panel: #10101c; --panel-2: #171728; --line: #2a2a44;
    --text: #e9e6f2; --muted: #8d89a6; --pink: #ff3ea5; --cyan: #2ee6ff; --amber: #ffc857; --green: #5dffa8;
    --mara: #ff3ea5; --jun: #2ee6ff; --nico: #5dffa8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #2a0b2a 0%, transparent 60%),
                radial-gradient(900px 500px at -10% 110%, #06283a 0%, transparent 60%), var(--bg);
    color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; max-width: 1180px; margin: 0 auto; padding: 12px 16px; gap: 12px; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .25em; font-weight: 800;
       color: var(--pink); text-shadow: 0 0 8px rgba(255,62,165,.7), 0 0 24px rgba(255,62,165,.35); }
  .clock { font: 600 14px ui-monospace, Menlo, monospace; color: var(--cyan); border: 1px solid var(--line);
           padding: 4px 10px; border-radius: 6px; background: var(--panel); }
  .hours { display: flex; gap: 4px; }
  .hours span { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
  .hours span.past { background: #3a3a55; } .hours span.now { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .spacer { flex: 1; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
           border-radius: 8px; padding: 9px 14px; cursor: pointer; text-align: left; transition: border-color .15s, box-shadow .15s; }
  button:hover:not(:disabled) { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan) inset; }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; }
  main { display: grid; grid-template-columns: 260px 1fr; gap: 12px; min-height: 0; }
  aside, .stage { background: rgba(16,16,28,.85); border: 1px solid var(--line); border-radius: 12px; min-height: 0; }
  aside { padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 18px; }
  .portrait { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font-size: 64px; font-weight: 800;
              background: linear-gradient(160deg, #1d1d33, #0b0b14); border: 1px solid var(--line); color: var(--muted); }
  .portrait[data-npc] { color: var(--c); border-color: var(--c); text-shadow: 0 0 18px var(--c); box-shadow: 0 0 30px -12px var(--c) inset; }
  .where { font-size: 13px; color: var(--muted); margin-top: 6px; text-align: center; }
  h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .18em; color: var(--muted); font-weight: 700; }
  .clue { border-left: 3px solid var(--amber); padding: 6px 10px; margin-bottom: 8px; background: rgba(255,200,87,.06); border-radius: 0 6px 6px 0; }
  .clue b { color: var(--amber); font-size: 13px; } .clue p { margin: 2px 0 0; font-size: 13px; color: #d9d2bb; }
  .empty { color: var(--muted); font-size: 13px; font-style: italic; }
  .lead { border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 0 8px 8px 0; padding: 8px 10px; margin-bottom: 8px; background: var(--panel); }
  .lead.ready { box-shadow: 0 0 0 1px var(--c), 0 0 18px -6px var(--c); }
  .lead .top { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
  .lead .top b { color: var(--c); } .lead .top span { color: var(--muted); font-size: 11px; }
  .lead p { margin: 3px 0 6px; font-size: 12px; color: #cfcbe0; }
  .lead .status { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .lead .status.ready { color: var(--amber); } .lead .status.shared { color: var(--green); } .lead .status.closed { color: #ff7b7b; }
  .tbar { height: 6px; background: var(--line); border-radius: 3px; position: relative; }
  .tbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--cyan); }
  .tbar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--amber); }
  .sallow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #ff8a8a; min-width: 0; }
  #sallow-where { max-width: 230px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header { gap: 12px !important; } header .pill { white-space: nowrap; }
  .sallow .pips { display: flex; gap: 3px; } .sallow .pips span { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #5a2630; }
  .sallow .pips span.on { background: #ff4d5e; border-color: #ff4d5e; box-shadow: 0 0 8px #ff4d5e; }
  .msg.hunt { align-self: center; font-size: 12px; color: #ff8a8a; padding: 2px 10px; border: 1px solid rgba(255,77,94,.4); border-radius: 99px; }
  .deals { border-top: 1px dashed var(--line); padding-top: 8px; }
  button.deal { border-color: rgba(255,200,87,.5); } button.deal.risky { border-style: dashed; color: #ffd98a; }
  .lead .want { font-size: 12px; color: var(--amber); margin: 0 0 6px; }
  .hideouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
  .hideouts button { display: flex; flex-direction: column; gap: 4px; border-color: rgba(255,62,165,.5); }
  .hideouts button b { color: var(--pink); } .hideouts button span { font-size: 12px; color: var(--muted); }
  .howto { align-self: stretch; max-width: none; border: 1px solid var(--cyan); background: rgba(46,230,255,.05); border-radius: 12px; padding: 14px 16px; }
  .howto b { color: var(--cyan); letter-spacing: .1em; font-size: 12px; } .howto ol { margin: 8px 0 0; padding-left: 20px; } .howto li { margin: 4px 0; }
  .meter { display: grid; grid-template-columns: 46px 1fr; gap: 2px 8px; font-size: 12px; margin-bottom: 8px; align-items: center; }
  .meter .name { font-weight: 700; grid-row: span 2; color: var(--c); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; position: relative; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 50%; border-radius: 3px; }
  .stage { display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
  .feed { overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; animation: in .2s ease-out; }
  @keyframes in { from { transform: translateY(4px); } }
  .msg.npc { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--muted)); align-self: flex-start; }
  .msg.npc .who { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--c); margin-bottom: 2px; }
  .msg.player { background: #241532; border: 1px solid #4a2560; align-self: flex-end; }
  .msg.narration { align-self: center; color: var(--muted); font-style: italic; text-align: center; max-width: 90%; }
  .msg.event { align-self: stretch; max-width: none; border: 1px dashed var(--pink); color: #ffd4ea; background: rgba(255,62,165,.06); }
  .msg.clue { align-self: stretch; max-width: none; border: 1px solid var(--amber); color: #ffe7a8; background: rgba(255,200,87,.08); }
  .msg.clue::before { content: "CASE BOARD +  "; font-weight: 800; letter-spacing: .1em; font-size: 11px; color: var(--amber); }
  .msg.system { align-self: center; font-size: 12px; color: var(--cyan); padding: 2px 10px; border: 1px solid rgba(46,230,255,.35); border-radius: 99px; }
  .msg.ending { align-self: stretch; max-width: none; text-align: center; font-size: 18px; padding: 18px;
                border: 1px solid var(--pink); color: #fff; box-shadow: 0 0 30px -10px var(--pink); }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; display: none; }
  .typing.on { display: block; }
  .controls { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; background: rgba(7,7,13,.6);
              max-height: 46vh; overflow-y: auto; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices.col { flex-direction: column; }
  .choices.small button { padding: 7px 11px; font-size: 14px; }
  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
                     border-radius: 8px; padding: 10px 12px; outline: none; }
  input[type=text]:focus { border-color: var(--pink); }
  .hint { font-size: 12px; color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--c); border-radius: 10px; padding: 12px; background: var(--panel-2); }
  .card b { color: var(--c); } .card ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: #cfcbe0; }
  .ending-title { font-size: 22px; font-weight: 800; color: #fff; text-shadow: 0 0 14px var(--pink); }
  .err { color: #ff7b7b; font-size: 13px; min-height: 1em; }
  @media (max-width: 760px) {
    .app { height: auto; min-height: 100vh; }
    main { grid-template-columns: 1fr; grid-template-rows: auto auto; }
    .stage { height: 82vh; }
    aside { flex-direction: row; overflow-x: auto; max-height: 180px; } .portrait { width: 90px; font-size: 36px; }
    aside > div { min-width: 220px; } .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>AFTER HOURS</h1>
    <div class="clock" id="clock">MIDNIGHT</div>
    <div class="hours" id="hours"></div>
    <div class="sallow" title="Sallow, Veyra's hunter, is looking for Rook too."><b>SALLOW</b><div class="pips" id="pips"></div><span id="sallow-where"></span></div>
    <div class="spacer"></div>
    <span class="pill" id="credits"></span>
    <span class="pill" id="mode"></span>
    <button class="ghost" id="restart">New night</button>
  </header>
  <main>
    <aside>
      <div>
        <div class="portrait" id="portrait">?</div>
        <div class="where" id="where">Kessler block</div>
      </div>
      <div><h2 id="board-title">CASE BOARD</h2><div id="board"></div></div>
      <div><h2>LEADS</h2><div id="leads"></div></div>
    </aside>
    <section class="stage">
      <div class="feed" id="feed"></div>
      <div class="controls">
        <div class="typing" id="typing"></div>
        <div id="panel"></div>
        <div class="err" id="err"></div>
      </div>
    </section>
  </main>
</div>
<script>
const SLOTS = ["midnight", "1am", "2am", "3am"];
const NAMES = { mara: "Mara", jun: "Jun", nico: "Nico" };
const COLORS = { mara: "var(--mara)", jun: "var(--jun)", nico: "var(--nico)" };
const FACT_TEXT = { lied_to: "Knows you lied to them", promised: "Remembers your promise", kindness: "Remembers you were kind",
  flirted: "Remembers you flirting", asked_openly: "Heard you asking around loudly" };
const $ = (id) => document.getElementById(id);
let snap = null, busy = false;

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style") n.style.cssText = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const kid of kids) n.append(kid);
  return n;
}

async function api(action, body = {}) {
  if (busy) return;
  busy = true; $("err").textContent = "";
  const waitingOn = snap && snap.npc && (action === "say" || action === "option") ? NAMES[snap.npc] : null;
  $("typing").textContent = waitingOn ? `${waitingOn} is typing…` : "";
  $("typing").classList.toggle("on", !!waitingOn);
  document.querySelectorAll(".controls button, .controls input").forEach((b) => (b.disabled = true));
  try {
    const res = await fetch(action === "state" ? "/api/state" : `/api/${action}`,
      action === "state" ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    snap = data; render();
  } catch (e) { $("err").textContent = e.message; render(); }
  finally { busy = false; $("typing").classList.remove("on"); }
}

function addFeed(items) {
  const feed = $("feed");
  for (const m of items) {
    const msg = el("div", { class: `msg ${m.kind}` });
    if (m.kind === "npc" && m.speaker) {
      msg.style.setProperty("--c", COLORS[m.speaker]);
      msg.append(el("span", { class: "who" }, NAMES[m.speaker].toUpperCase()));
    }
    msg.append(m.text);
    feed.append(msg);
  }
}

function render() {
  if (!snap) return;
  addFeed(snap.feed || []); snap.feed = [];
  const i = SLOTS.indexOf(snap.slot);
  $("clock").textContent = snap.phase === "dawn" ? "4:00 AM · DAWN" : snap.slot.toUpperCase().replace("AM", " AM");
  $("hours").replaceChildren(...SLOTS.map((_, j) => el("span", { class: snap.phase === "dawn" || j < i ? "past" : j === i ? "now" : "" })));
  $("credits").textContent = `${snap.credits} credits`;
  $("pips").replaceChildren(...Array.from({ length: snap.sallow.max }, (_, j) => el("span", { class: j < snap.sallow.heat ? "on" : "" })));
  $("sallow-where").textContent = snap.sallow.where;
  $("mode").textContent = snap.mode === "agent" ? "Agent mode" : "Scripted mode";

  const p = $("portrait");
  if (snap.npc) { p.dataset.npc = snap.npc; p.style.setProperty("--c", COLORS[snap.npc]); p.textContent = NAMES[snap.npc][0]; }
  else { delete p.dataset.npc; p.textContent = snap.phase === "finale" ? "R" : "◇"; }
  const here = snap.npc ? `${snap.npc_name} · ${snap.location_name}` : snap.phase === "finale" ? "Kessler freight lift" : "Kessler block";
  $("where").textContent = here;

  $("board").replaceChildren(...(snap.case_board.length ? snap.case_board.map((c) =>
    el("div", { class: "clue" }, el("b", {}, c.title), el("p", {}, c.text))) : [el("div", { class: "empty" }, "No clues yet. Two will lead you to Rook.")]));

  $("board-title").textContent = `CASE BOARD · ${Math.min(snap.case_board.length, snap.clues_needed)}/${snap.clues_needed} CLUES`;
  const STATUS = { new: () => "Haven't met yet", met: () => "Ask what it would take.", want: (l) => `Make a deal, or earn trust ${l.needed}`,
    ready: () => "Ready to talk. Ask about Rook!", shared: () => "✓ Told you what they know", closed: () => "Won't talk to you now" };
  $("leads").replaceChildren(...snap.leads.map((l) => el("div", { class: `lead ${l.status}`, style: `--c:${COLORS[l.npc]}` },
    el("div", { class: "top" }, el("b", {}, l.name), el("span", {}, l.where)),
    el("p", {}, l.hint),
    ...(l.want ? [el("div", { class: "want" }, "Wants: " + l.want.replace(/^Wants /, ""))] : []),
    el("div", { class: "tbar", title: `Trust ${l.trust} (needs ${l.needed})` },
      el("i", { style: `width:${Math.max(0, l.trust) * 20}%` }), el("u", { style: `left:${l.needed * 20}%` })),
    el("div", { class: `status ${l.status}` }, STATUS[l.status](l)))),
    el("div", { class: "hint" }, "Blue bar: trust. Gold line: trust needed to talk them round without a deal."));

  const panel = $("panel"); panel.replaceChildren();
  if (snap.phase === "choose_location") {
    if (snap.hideouts.length) {
      panel.append(el("div", { class: "hint" }, "Where is Rook hiding? You get one try. Use your case board."),
        el("div", { class: "hideouts" }, ...snap.hideouts.map((h) => el("button", {
          onclick: () => { if (confirm(`Search the ${h.name}? This is your one guess.`)) api("visit", { location: h.id }); } },
          el("b", {}, h.name), el("span", {}, h.about)))),
        el("div", { class: "hint" }, "Or spend the last hour with someone:"));
    } else {
      panel.append(el("div", { class: "hint" }, "Where do you spend the next hour?"));
    }
    panel.append(el("div", { class: "choices" }, ...snap.locations.map((l) => el("button", { onclick: () => api("visit", { location: l.id }) }, l.name))));
  } else if (snap.phase === "event" && snap.event) {
    panel.append(el("div", { class: "choices" }, ...Object.entries(snap.event.choices).map(([k, label]) =>
      el("button", { onclick: () => api("event", { choice: k }) }, label))));
  } else if (snap.phase === "talk") {
    panel.append(el("div", { class: "hint" }, snap.mode === "agent" ? "Ideas (or type your own below):" : "Choose what to say:"));
    const opts = el("div", { class: "choices small" }, ...snap.options.map((o, j) =>
      el("button", { onclick: () => snap.mode === "agent" ? api("say", { text: o }) : api("option", { index: j }) }, o)));
    panel.append(opts);
    if (snap.deals.length) {
      panel.append(el("div", { class: "deals" }, el("div", { class: "hint" }, `Deals for ${snap.npc_name}:`),
        el("div", { class: "choices small" }, ...snap.deals.map((d) =>
          el("button", { class: `deal ${d.risky ? "risky" : ""}`, onclick: () => api("deal", { deal: d.id }) }, d.label)))));
    }
    if (snap.mode === "agent") {
      const input = el("input", { type: "text", maxlength: "300", placeholder: `Type anything to ${snap.npc_name}…` });
      const send = () => { const t = input.value.trim(); if (t) api("say", { text: t }); };
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
      panel.append(el("div", { class: "row" }, input, el("button", { onclick: send }, "Say")));
      setTimeout(() => input.focus(), 0);
    }
    panel.append(el("div", { class: "row" }, el("span", { class: "hint", style: "flex:1;align-self:center" },
      `${snap.exchanges_left} exchanges left this hour`), el("button", { class: "ghost", onclick: () => api("leave") }, "Leave")));
  } else if (snap.phase === "finale") {
    panel.append(el("div", { class: "choices col" }, ...Object.entries(snap.finale_choices).map(([k, label]) =>
      el("button", { onclick: () => api("finale", { choice: k }) }, label))));
  } else if (snap.phase === "dawn") {
    panel.append(el("div", { class: "ending-title" }, snap.ending ? snap.ending.title : "Dawn"), el("div", { class: "cards" }, ...snap.dawn_cards.map((c) => {
      const npc = c.npc.toLowerCase(), items = [];
      if (c.promise_broken) items.push("“You made me a promise.”");
      if (c.betrayed) items.push("Knows you sold her out to Jun");
      if (c.deal && !c.promise_broken) items.push("You kept your deal");
      c.facts.forEach((f) => items.push(FACT_TEXT[f] || f));
      c.remembers.forEach((r) => items.push(r));
      if (!items.length) items.push("Barely remembers you.");
      return el("div", { class: "card", style: `--c:${COLORS[npc]}` }, el("b", {}, c.npc),
        el("div", { class: "hint" }, `Trust ${c.trust} · Warmth ${c.warmth}`), el("ul", {}, ...items.map((t) => el("li", {}, t))));
    })), el("div", { class: "row" }, el("button", { onclick: () => { $("feed").replaceChildren(el("div", { class: "msg narration" }, INTRO), howTo()); api("new", { mode: snap.mode }); } }, "Play another night")));
  }
  requestAnimationFrame(() => { $("feed").scrollTop = $("feed").scrollHeight; });
}

const INTRO = `Rook didn't come home. Their last message: "At the Lantern. Tell no one." The checkpoint opens at 4 a.m.`;
$("restart").addEventListener("click", () => {
  if (confirm("Start a new night? This one will be lost.")) { $("feed").replaceChildren(el("div", { class: "msg narration" }, INTRO), howTo()); api("new", { mode: snap ? snap.mode : undefined }); }
});
function howTo() {
  const typing = snap && snap.mode === "agent";
  return el("div", { class: "msg howto" }, el("b", {}, "HOW TO PLAY"), el("ol", {},
    el("li", {}, "Find Rook before 4 a.m. Each hour, pick a place and talk to whoever is there. Each person knows one piece."),
    el("li", {}, "Everyone wants something. Ask what it would take, then make a deal (some are gambles, some betray someone else)."),
    el("li", {}, "Sallow is hunting Rook too. Every hour he gets closer. Shouting about Rook or getting caught lying speeds him up."),
    el("li", {}, "At 3 a.m. you choose where Rook is hiding. One guess. Read your clues carefully."),
    el("li", {}, typing ? "Type anything you want. The suggestions are just ideas. They remember what you say." :
      "Pick what to say from the menu. Watch for events: some are shortcuts.")));
}
$("feed").append(el("div", { class: "msg narration" }, INTRO));
api("state").then(() => { if (snap && snap.slot === "midnight" && snap.phase === "choose_location") {
  $("feed").append(howTo()); } });
</script>
</body>
</html>
